<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="320" viewBox="0 0 1100 320" role="img" aria-labelledby="title desc">
  <title id="title">Arturo Rivera's field notes on reliable systems</title>
  <desc id="desc">A warm notebook-style header about building data systems that can explain themselves.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#D8CCBA" stroke-width="1" opacity="0.55"/>
    </pattern>
    <filter id="shadow" x="-5%" y="-8%" width="110%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#172535" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="1080" height="296" rx="18" fill="#172535" opacity="0.12"/>
  <g filter="url(#shadow)">
    <rect x="10" y="5" width="1080" height="296" rx="18" fill="#F4EEDF" stroke="#26384D" stroke-width="3"/>
    <rect x="10" y="5" width="1080" height="296" rx="18" fill="url(#grid)"/>
  </g>

  <line x1="82" y1="6" x2="82" y2="300" stroke="#C85B4B" stroke-width="2" opacity="0.72"/>
  <circle cx="46" cy="74" r="7" fill="#F4EEDF" stroke="#26384D" stroke-width="2"/>
  <circle cx="46" cy="152" r="7" fill="#F4EEDF" stroke="#26384D" stroke-width="2"/>
  <circle cx="46" cy="230" r="7" fill="#F4EEDF" stroke="#26384D" stroke-width="2"/>

  <text x="112" y="48" fill="#C85B4B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="2">ARTURO RIVERA / FIELD NOTES 01</text>
  <text x="112" y="112" fill="#172535" font-family="Georgia, 'Times New Roman', serif" font-size="43" font-weight="700">I build systems that can</text>
  <text x="112" y="160" fill="#172535" font-family="Georgia, 'Times New Roman', serif" font-size="43" font-style="italic">explain themselves.</text>

  <path d="M112 190 C205 184 300 196 390 188" fill="none" stroke="#C85B4B" stroke-width="3" stroke-linecap="round"/>
  <text x="112" y="226" fill="#26384D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">build</text>
  <text x="179" y="226" fill="#7E6F5B" font-family="Georgia, serif" font-size="20">→</text>
  <text x="215" y="226" fill="#26384D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">break</text>
  <text x="282" y="226" fill="#7E6F5B" font-family="Georgia, serif" font-size="20">→</text>
  <text x="318" y="226" fill="#26384D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">recover</text>
  <text x="404" y="226" fill="#7E6F5B" font-family="Georgia, serif" font-size="20">→</text>
  <text x="440" y="226" fill="#26384D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">prove</text>
  <text x="112" y="264" fill="#6A5D4B" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic">data platforms · practical AI systems · reliability</text>

  <g transform="translate(774 55) rotate(-2)">
    <rect x="0" y="0" width="244" height="126" rx="8" fill="#E8DFC9" stroke="#26384D" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="122" y="33" text-anchor="middle" fill="#26384D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.4">WORKING PRINCIPLES</text>
    <line x1="24" y1="48" x2="220" y2="48" stroke="#B4A68F" stroke-width="1"/>
    <text x="24" y="76" fill="#26384D" font-family="Georgia, serif" font-size="17">✓ local first</text>
    <text x="24" y="103" fill="#26384D" font-family="Georgia, serif" font-size="17">✓ evidence over claims</text>
  </g>

  <path d="M812 213 C856 190 910 194 957 213" fill="none" stroke="#4E7A73" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M950 205 L962 213 L949 220" fill="none" stroke="#4E7A73" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="770" y="252" fill="#4E7A73" font-family="Georgia, serif" font-size="18" font-style="italic">make the failure useful</text>
</svg>
